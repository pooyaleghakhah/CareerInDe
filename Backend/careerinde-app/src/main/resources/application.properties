# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}
app.base-url=${APP_BASE_URL:http://localhost:8080}


# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# AI PROVIDERS
# ===============================

openai.api.key=${GROQ_API_KEY:}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

openrouter.api.key=${OPENROUTER_API_KEY:}

cohere.api.key=${COHERE_API_KEY:}


# ===============================
# EMAIL
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

resend.api.key=${RESEND_API_KEY:}

app.mail.from=CareerInDe <noreply@careerinde.com>


# ===============================
# JOB PROVIDERS
# ===============================

jooble.api.key=${JOOBLE_API_KEY:}



# ===============================
# APPLICATION DOCUMENTS
# ===============================

app.storage.application-documents=${APPLICATION_DOCUMENT_STORAGE:uploads/applications}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
