<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | CareerInDe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            background: #ecfdf5;
            color: #047857;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Forgot your password?</h1>

    <p>
        Enter your email address and we'll send you
        a link to reset your password.
    </p>

    <div
        class="success"
        th:if="${successMessage}"
        th:text="${successMessage}">
    </div>

    <form
        th:action="@{/forgot-password}"
        method="post">

        <label for="email">Email address</label>

        <input
            id="email"
            type="email"
            name="email"
            placeholder="you@example.com"
            required>

        <button type="submit">
            Send reset link
        </button>

    </form>

    <div class="back">
        <a th:href="@{/login}">
            Back to login
        </a>
    </div>

</div>

</body>
</html>
