<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        CareerInDe | Profile
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .container {
                margin: 10px auto;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            Career Profile
        </h1>

        <p>
            Manage your professional information
            and career goals.
        </p>

    </div>

    <div
        class="success"
        th:if="${successMessage}"
        th:text="${successMessage}">
    </div>

    <div class="card">

        <form
            th:action="@{/profile}"
            th:object="${profile}"
            method="post">

            <!-- Spring Security CSRF -->

            <input
                type="hidden"
                th:if="${_csrf != null}"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <h2 class="section-title">
                Personal Information
            </h2>

            <div class="grid">

                <div class="field">

                    <label>
                        First Name
                    </label>

                    <input
                        type="text"
                        th:field="*{firstName}"
                        placeholder="First name">

                </div>


                <div class="field">

                    <label>
                        Last Name
                    </label>

                    <input
                        type="text"
                        th:field="*{lastName}"
                        placeholder="Last name">

                </div>


                <div class="field">

                    <label>
                        Nationality
                    </label>

                    <input
                        type="text"
                        th:field="*{nationality}"
                        placeholder="Nationality">

                </div>


                <div class="field">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        th:field="*{phone}"
                        placeholder="+49 ...">

                </div>

            </div>


            <h2 class="section-title">
                Location
            </h2>

            <div class="grid">

                <div class="field">

                    <label>
                        Country
                    </label>

                    <input
                        type="text"
                        th:field="*{country}"
                        placeholder="Germany">

                </div>


                <div class="field">

                    <label>
                        Current City
                    </label>

                    <input
                        type="text"
                        th:field="*{city}"
                        placeholder="Current city">

                </div>


                <div class="field">

                    <label>
                        Target City
                    </label>

                    <input
                        type="text"
                        th:field="*{targetCity}"
                        placeholder="Target city">

                </div>

            </div>


            <h2 class="section-title">
                Career
            </h2>

            <div class="grid">

                <div class="field">

                    <label>
                        Target Job
                    </label>

                    <input
                        type="text"
                        th:field="*{targetJob}"
                        placeholder="Java Backend Developer">

                </div>


                <div class="field">

                    <label>
                        Experience Years
                    </label>

                    <input
                        type="number"
                        min="0"
                        th:field="*{experienceYears}"
                        placeholder="0">

                </div>


                <div class="field">

                    <label>
                        Salary Expectation
                    </label>

                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        th:field="*{salaryExpectation}"
                        placeholder="50000">

                </div>

            </div>


            <h2 class="section-title">
                Languages
            </h2>

            <div class="grid">

                <div class="field">

                    <label>
                        German Level
                    </label>

                    <select
                        th:field="*{germanLevel}">

                        <option value="">
                            Select
                        </option>

                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="B1">B1</option>
                        <option value="B2">B2</option>
                        <option value="C1">C1</option>
                        <option value="C2">C2</option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        English Level
                    </label>

                    <select
                        th:field="*{englishLevel}">

                        <option value="">
                            Select
                        </option>

                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="B1">B1</option>
                        <option value="B2">B2</option>
                        <option value="C1">C1</option>
                        <option value="C2">C2</option>

                    </select>

                </div>

            </div>


            <h2 class="section-title">
                Professional Links
            </h2>

            <div class="grid">

                <div class="field">

                    <label>
                        LinkedIn
                    </label>

                    <input
                        type="url"
                        th:field="*{linkedinUrl}"
                        placeholder="https://linkedin.com/in/...">

                </div>


                <div class="field">

                    <label>
                        GitHub
                    </label>

                    <input
                        type="url"
                        th:field="*{githubUrl}"
                        placeholder="https://github.com/...">

                </div>


                <div class="field full-width">

                    <label>
                        Portfolio
                    </label>

                    <input
                        type="url"
                        th:field="*{portfolioUrl}"
                        placeholder="https://...">

                </div>

            </div>


            <h2 class="section-title">
                About Me
            </h2>

            <div class="grid">

                <div class="field full-width">

                    <textarea
                        th:field="*{aboutMe}"
                        maxlength="2000"
                        placeholder="Tell us about your professional background...">
                    </textarea>

                </div>

            </div>


            <div class="actions">

                <button type="submit">
                    Save Profile
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
