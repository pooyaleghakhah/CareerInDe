<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Changed | CareerInDe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .check {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        a {
            display: block;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            text-decoration: none;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="check">✓</div>

    <h1>Password changed</h1>

    <p th:text="${successMessage}">
        Your password has been changed successfully.
    </p>

    <a th:href="@{/login}">
        Continue to login
    </a>

</div>

</body>
</html>
