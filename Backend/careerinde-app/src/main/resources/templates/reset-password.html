<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CareerInDe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Reset your password</h1>

    <div
        class="error"
        th:if="${errorMessage}"
        th:text="${errorMessage}">
    </div>

    <!-- Only show form when token is valid -->

    <form
        th:if="${tokenValid}"
        th:action="@{/reset-password}"
        method="post">

        <input
            type="hidden"
            name="token"
            th:value="${token}">

        <label for="password">
            New password
        </label>

        <input
            id="password"
            type="password"
            name="password"
            minlength="8"
            autocomplete="new-password"
            required>

        <label for="confirmPassword">
            Confirm new password
        </label>

        <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            required>

        <button type="submit">
            Reset password
        </button>

    </form>

    <div class="back">

        <a
            th:if="${tokenValid == null or !tokenValid}"
            th:href="@{/forgot-password}">
            Request a new reset link
        </a>

    </div>

</div>

</body>
</html>
