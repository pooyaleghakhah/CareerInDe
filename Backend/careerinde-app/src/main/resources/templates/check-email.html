<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Check Your Email | CareerInDe
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;

            background: #ffffff;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                    0 8px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 24px;

            border-radius: 50%;

            background: #f1f1f1;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {
            margin-bottom: 12px;

            font-size: 28px;
        }

        .description {
            color: #666;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        .email {
            display: inline-block;

            padding: 10px 16px;

            border-radius: 8px;

            background: #f5f5f5;

            font-weight: bold;

            margin-bottom: 20px;

            word-break: break-all;
        }

        .info {
            color: #777;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        .login-link {
            display: inline-block;

            text-decoration: none;

            color: #ffffff;

            background: #000000;

            padding: 13px 24px;

            border-radius: 8px;

            font-weight: bold;
        }

        .login-link:hover {
            opacity: 0.85;
        }

        .brand {
            margin-top: 30px;

            font-size: 13px;

            color: #999;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="icon">
        ✉
    </div>

    <h1>
        Check your email
    </h1>

    <p class="description">
        We sent a verification link to:
    </p>

    <div class="email"
         th:text="${email}">
        user@example.com
    </div>

    <p class="info">
        Open the email and click the verification link
        to activate your CareerInDe account.
        <br><br>
        The verification link expires in 30 minutes.
    </p>

    <a class="login-link"
       th:href="@{/login}">
        Go to Login
    </a>

    <div class="brand">
        CareerInDe
    </div>

</div>

</body>
</html>
